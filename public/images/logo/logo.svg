<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="100%" height="100%" fill="none">
  <!-- Símbolo / Emblema -->
  <g transform="translate(10, 10)">
    <!-- Círculo e Globo Base -->
    <circle cx="50" cy="50" r="46" stroke="#0D2A4A" stroke-width="3" fill="#FFFFFF"/>
    <circle cx="50" cy="50" r="41" stroke="#EBF4FC" stroke-width="1.5" fill="#F0F6FB"/>
    
    <!-- Linhas de latitude / longitude do globo -->
    <ellipse cx="50" cy="50" rx="41" ry="18" stroke="#1B5E99" stroke-width="1" stroke-opacity="0.35" fill="none"/>
    <ellipse cx="50" cy="50" rx="22" ry="41" stroke="#1B5E99" stroke-width="1" stroke-opacity="0.35" fill="none"/>
    <line x1="9" y1="50" x2="91" y2="50" stroke="#1B5E99" stroke-width="1" stroke-opacity="0.35"/>
    <line x1="50" y1="9" x2="50" y2="91" stroke="#1B5E99" stroke-width="1" stroke-opacity="0.35"/>

    <!-- Silhueta da América do Sul / Brasil estilizada -->
    <path d="M42 34 C47 31, 56 32, 60 36 C63 39, 64 45, 59 50 C56 53, 53 58, 51 64 C49 68, 46 72, 43 75 C41 73, 40 68, 41 62 C38 56, 36 49, 39 42 Z" fill="#0D2A4A" opacity="0.9"/>

    <!-- Cruz Resplandecente em Dourado -->
    <g id="cross">
      <!-- Brilho / Halo da Cruz -->
      <circle cx="70" cy="30" r="18" fill="#E5A93C" opacity="0.25"/>
      <path d="M70 12 L70 48 M56 24 L84 24" stroke="#E5A93C" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M70 14 L70 46 M58 24 L82 24" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Tipografia Institucional -->
  <g transform="translate(125, 24)">
    <!-- MINISTÉRIO -->
    <text x="0" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#0D2A4A">
      MINISTÉRIO
    </text>

    <!-- EVANGELISMO -->
    <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="0.5" fill="#0D2A4A">
      EVANGELISMO
    </text>

    <!-- SEM FRONTEIRAS -->
    <text x="0" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="900" letter-spacing="0.5" fill="#0D2A4A">
      SEM FRONTEIRAS
    </text>

    <!-- Linha Divisória e Lema -->
    <text x="0" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.5" fill="#1B5E99">
      LEVANDO ESPERANÇA A TODOS OS POVOS
    </text>
  </g>
</svg>
