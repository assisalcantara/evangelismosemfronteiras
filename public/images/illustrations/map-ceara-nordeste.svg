<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" fill="none" width="100%" height="100%">
  <!-- Contorno da América do Sul / Brasil -->
  <path d="M 60 40 
           C 85 30, 140 25, 175 45 
           C 205 60, 220 85, 215 110 
           C 210 135, 185 160, 160 185 
           C 145 200, 130 220, 115 235 
           C 105 235, 95 210, 90 190 
           C 75 160, 60 130, 50 100 
           C 45 80, 50 55, 60 40 Z" 
        stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 3" fill="#F8FAFC"/>

  <!-- Destaque Região Nordeste -->
  <path d="M 125 45 
           C 150 40, 180 50, 198 70 
           C 210 88, 205 110, 190 120 
           C 175 125, 155 120, 145 105 
           C 135 90, 125 65, 125 45 Z" 
        fill="#EBF4FC" stroke="#93C5FD" stroke-width="1.5"/>

  <!-- Ponto / Pin em Casa de Pedra (Pentecoste - CE) -->
  <g transform="translate(160, 65)">
    <!-- Ondas de expansão missionária -->
    <circle cx="0" cy="0" r="14" stroke="#1B5E99" stroke-width="1" opacity="0.3" stroke-dasharray="2 2"/>
    <circle cx="0" cy="0" r="24" stroke="#1B5E99" stroke-width="1" opacity="0.15" stroke-dasharray="3 3"/>
    
    <!-- Marcador de Localização -->
    <path d="M 0 -16 C -6 -16, -10 -11, -10 -5 C -10 3, 0 14, 0 14 C 0 14, 10 3, 10 -5 C 10 -11, 6 -16, 0 -16 Z" fill="#0D2A4A"/>
    <circle cx="0" cy="-6" r="3.5" fill="#E5A93C"/>
  </g>

  <!-- Rótulos e Indicações -->
  <text x="180" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0D2A4A">
    Casa de Pedra
  </text>
  <text x="180" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#64748B">
    Pentecoste – CE
  </text>

  <text x="140" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#1B5E99" text-anchor="middle">
    E de Casa de Pedra
  </text>
  <text x="140" y="208" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#1B5E99" text-anchor="middle">
    para todo o Nordeste.
  </text>
</svg>
